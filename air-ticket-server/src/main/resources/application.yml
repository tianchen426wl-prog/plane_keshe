server:
  port: 8080

spring:
  config:
    import: optional:file:.local/application-local.yml,optional:file:../.local/application-local.yml
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:air_ticket}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USERNAME:${local.db-username:root}}
    password: ${DB_PASSWORD:${local.db-password:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
  sql:
    init:
      mode: never
  flyway:
    enabled: ${DB_INITIALIZE:true}
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false

app:
  database:
    initialize: ${DB_INITIALIZE:true}
    create-if-missing: ${DB_CREATE_IF_MISSING:true}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.airticket.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  config: classpath:logback-spring.xml
  file:
    path: logs/air-ticket
  level:
    com.airticket.mapper: INFO
    com.airticket: INFO
    org.springframework: INFO
    com.zaxxer.hikari: INFO

jwt:
  secret: ${JWT_SECRET:${local.jwt-secret:}}
  expiration: 86400000

flights:
  window-days: 30
  generation:
    enabled: ${FLIGHT_GENERATION_ENABLED:true}
    cron: "0 5 0 * * *"

ai:
  enabled: ${AI_ENABLED:${local.ai-enabled:false}}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:${local.deepseek-api-key:}}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    base-url: https://api.deepseek.com
    timeout-seconds: 20
